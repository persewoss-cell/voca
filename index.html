<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하윤이의 단어장</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="home-screen">
    <h1 class="home-title">하윤이의 단어장</h1>
    <div id="book-list" class="book-list">
      <div class="book-row static">
        <a class="book-btn" href="isadora-moon.html">Isadora Moon</a>
      </div>
    </div>
    <button id="add-book-btn" class="add-book-btn" type="button">+ 새 단어장 추가</button>
  </div>

  <div id="book-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="book-modal-title">
      <h2 id="book-modal-title">새 단어장 추가</h2>
      <form id="book-form">
        <div class="form-field">
          <label for="form-book-name">단어장 이름</label>
          <input id="form-book-name" type="text" required maxlength="30">
        </div>
        <div class="modal-actions">
          <button type="button" id="book-modal-cancel" class="modal-btn secondary">취소</button>
          <button type="submit" class="modal-btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="home.js?v=5"></script>
</body>
</html>
